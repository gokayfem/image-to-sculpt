name: checks

on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # Only what the fitting code imports. fal-client, matplotlib, Blender and ffmpeg are optional here.
      - run: pip install numpy scipy scikit-image Pillow
      - run: python tests/run_tests.py
      - run: python tests/run_tests.py pipeline --slow
      - run: python skills/image-to-sculpt/scripts/i2s.py --help
